<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
      color:white;
    }

    .app{
      width:100%;
      max-width:700px;
      background:#1e293b;
      border-radius:20px;
      padding:35px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      font-size:2.5rem;
    }

    .subtitle{
      text-align:center;
      color:#94a3b8;
      margin-bottom:30px;
    }

    .task-form{
      display:flex;
      gap:10px;
      margin-bottom:30px;
    }

    .task-form input{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#334155;
      color:white;
      font-size:1rem;
    }

    .task-form button{
      padding:14px 22px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    .task-form button:hover{
      background:#1d4ed8;
    }

    .task-list{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .task{
      background:#334155;
      padding:18px;
      border-radius:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .task.completed{
      opacity:0.6;
      text-decoration:line-through;
    }

    .task-left{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .task-left input{
      width:20px;
      height:20px;
    }

    .delete-btn{
      background:#ef4444;
      border:none;
      padding:10px 16px;
      border-radius:10px;
      color:white;
      cursor:pointer;
      transition:0.3s;
    }

    .delete-btn:hover{
      background:#dc2626;
    }

    .footer{
      margin-top:30px;
      text-align:center;
      color:#94a3b8;
      font-size:0.9rem;
    }

  </style>

</head>

<body>

  <div class="app">

    <h1>📝 Task Manager</h1>

    <p class="subtitle">
      DevOps CI/CD Project using Jenkins, Docker & Kubernetes
    </p>

    <div class="task-form">
      <input type="text" id="taskInput" placeholder="Enter a task...">
      <button onclick="addTask()">Add Task</button>
    </div>

    <div class="task-list" id="taskList"></div>

    <div class="footer">
      Running on Kubernetes ☸ | Monitored by Prometheus 📊
    </div>

  </div>

<script>

const API_URL = '/api/tasks';

async function fetchTasks() {

  const response = await fetch(API_URL);
  const tasks = await response.json();

  const taskList = document.getElementById('taskList');
  taskList.innerHTML = '';

  tasks.forEach(task => {

    const div = document.createElement('div');
    div.className = task.completed ? 'task completed' : 'task';

    div.innerHTML = `
      <div class="task-left">
        <input type="checkbox"
          ${task.completed ? 'checked' : ''}
          onchange="toggleTask('${task._id}', ${task.completed})">
        <span>${task.title}</span>
      </div>

      <button class="delete-btn"
        onclick="deleteTask('${task._id}')">
        Delete
      </button>
    `;

    taskList.appendChild(div);

  });

}

async function addTask() {

  const input = document.getElementById('taskInput');

  if(input.value.trim() === '') return;

  await fetch(API_URL, {
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      title:input.value,
      completed:false
    })
  });

  input.value = '';

  fetchTasks();

}

async function toggleTask(id, completed) {

  await fetch(`${API_URL}/${id}`, {
    method:'PUT',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      completed:!completed
    })
  });

  fetchTasks();

}

async function deleteTask(id) {

  await fetch(`${API_URL}/${id}`, {
    method:'DELETE'
  });

  fetchTasks();

}

fetchTasks();

</script>

</body>
</html>
